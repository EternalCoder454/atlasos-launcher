[package]
name = "telamon-launcher-core"
description = "Telamon Launcher's search, ranking and parsers (no Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Not published to crates.io (cargo-deny then treats path dependencies as local).
publish = false

[dependencies]
log.workspace = true
# NFKD for folding diacritics (unicode-rs, the standard crate for it).
unicode-normalization = "0.1"
# Telamon Settings' search-index.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# recently-used.xbel (streaming reader, no serde), as the Store reads AppStream.
quick-xml = { version = "0.42", default-features = false }
# Atomic writes (fsync of the file and its folder), file modes.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Property tests (tests/props.rs): `cargo test -- props`, with
# PROPTEST_CASES=20000 for the long run (docs/SECURITY.md).
proptest = { version = "1", default-features = false, features = ["std"] }
