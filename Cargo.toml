[workspace]
resolver = "3"
members = ["crates/telamon-launcher-core", "apps/telamon-launcher"]

[workspace.package]
version = "0.3.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-launcher"
rust-version = "1.89"

[workspace.dependencies]
# The atlas-framework crates (startup, settings, logging, crash reports); to
# move the pin, see CLAUDE.md. Telamon.Ui is not pinned here: it is the
# installed telamon-ui package.
telamon-framework-ui = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
log = { version = "0.4", features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
