[package]
name = "atlas-launcher"
description = "AtlasOS Launcher: Start menu and search (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "atlas_launcher"
crate-type = ["staticlib", "rlib"]

[dependencies]
telamon-framework-ui.workspace = true
atlas-launcher-core = { path = "../../crates/atlas-launcher-core" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
log.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
